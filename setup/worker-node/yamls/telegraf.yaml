apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegraf
  template:
    metadata:
      labels:
        app: telegraf
    spec:
      nodeSelector:
        node-role: fog
      containers:
        - name: telegraf
          image: telegraf:1.30
          ports:
            - containerPort: 9273
          volumeMounts:
            - name: config
              mountPath: /etc/telegraf/telegraf.conf
              subPath: telegraf.conf
      volumes:
        - name: config
          configMap:
            name: telegraf-config
---
apiVersion: v1
kind: Service
metadata:
  name: telegraf-metrics
  namespace: default
  labels:
    app: telegraf
    release: kube-prometheus-stack
spec:
  type: NodePort
  selector:
    app: telegraf
  ports:
    - name: metrics
      port: 9273
      targetPort: 9273
      nodePort: 30273
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: telegraf-servicemonitor
  namespace: default
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: telegraf
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: metrics
      interval: 10s
      path: /metrics
