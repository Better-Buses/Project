apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf
  labels:
    app: telegraf
    zone: "${ZONE}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegraf
      zone: "${ZONE}"
  template:
    metadata:
      labels:
        app: telegraf
        zone: "${ZONE}"
    spec:
      nodeSelector:
        zone: "${ZONE}"
      containers:
        - name: telegraf
          image: telegraf:1.30
          ports:
            - containerPort: 9273
          volumeMounts:
            - name: config
              mountPath: /etc/telegraf/telegraf.conf
              subPath: telegraf.conf
      volumes:
        - name: config
          configMap:
            name: telegraf-config
---
apiVersion: v1
kind: Service
metadata:
  name: telegraf-metrics
  labels:
    app: telegraf
    zone: "${ZONE}"
    release: kube-prometheus-stack
spec:
  selector:
    app: telegraf
    zone: "${ZONE}"
  ports:
    - name: metrics
      port: 9273
      targetPort: 9273
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: telegraf-servicemonitor
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: telegraf
      zone: "${ZONE}"
  namespaceSelector:
    matchNames:
      - zone-${ZONE}
  endpoints:
    - port: metrics
      interval: 10s
      path: /metrics

# the Prometheus Operator only picks up ServiceMonitors from namespaces its own Prometheus CR is configured to watch (serviceMonitorNamespaceSelector). If your kube-prometheus-stack install is set to watch only its own namespace, your zone-* ServiceMonitors will be silently ignored no matter how correct they are. Worth a quick check with kubectl get prometheus -A -o yaml | grep -A5 serviceMonitorNamespaceSelector.