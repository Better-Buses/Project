apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: telegraf-servicemonitor-zone-${ZONE}
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: telegraf
      zone: "${ZONE}"
  namespaceSelector:
    matchNames:
      - zone-${ZONE}
  endpoints:
    - port: metrics
      interval: 10s
      path: /metrics
