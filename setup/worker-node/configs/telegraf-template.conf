[agent]
  interval = "5s"
  flush_interval = "10s"
  debug = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["zone-${ZONE}/+"]
  data_format = "value"
  data_type = "float"
  name_override = "sensor"

[[processors.override]]
  [processors.override.tags]
    node = "worker-${ZONE}"

[[aggregators.basicstats]]
  period = "30s"
  drop_original = false
  stats = ["mean", "min", "max"]

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  path = "/metrics"
