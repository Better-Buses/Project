[agent]
  interval = "5s"
  flush_interval = "10s"
  debug = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["zone-${ZONE}/stop-+"]
  data_format = "value"
  data_type = "string"
  name_override = "stop"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["zone-${ZONE}/bus"]
  data_format = "json"
  name_override = "bus_position"

[[processors.execd]]
  namepass = ["stop_offset"]
  command = ["python3", "/data/offset_calc.py"]

[[processors.override]]
  [processors.override.tags]
    node = "worker-${ZONE}"

[[aggregators.basicstats]]
  namepass = ["stop_offset"]
  period = "60s"
  drop_original = false
  stats = ["mean", "min", "max"]

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  path = "/metrics"
