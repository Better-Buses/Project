apiVersion: v1
kind: ConfigMap
metadata:
  name: subscriber-script
data:
  subscriber.py: |
    import paho.mqtt.client as mqtt

    BROKER_HOST = "mosquitto"   # Service name, resolved via internal cluster DNS
    BROKER_PORT = 1883          # internal port, not the NodePort
    TOPIC = "zone-1/#"          # subscribe to all sensors under this prefix

    readings = []

    def on_connect(client, userdata, flags, reason_code, properties=None):
        print(f"Connected to broker (reason code: {reason_code})")
        client.subscribe(TOPIC)

    def on_message(client, userdata, msg):
        try:
            value = float(msg.payload.decode())
        except ValueError:
            print(f"Non-numeric payload on {msg.topic}: {msg.payload}")
            return

        readings.append(value)
        avg = sum(readings) / len(readings)
        print(f"[{msg.topic}] value={value}  count={len(readings)}  running_avg={avg:.2f}")

    client = mqtt.Client(callback_api_version=mqtt.CallbackAPIVersion.VERSION2)
    client.on_connect = on_connect
    client.on_message = on_message
    client.connect(BROKER_HOST, BROKER_PORT, keepalive=60)
    client.loop_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriber
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subscriber
  template:
    metadata:
      labels:
        app: subscriber
    spec:
      containers:
        - name: subscriber
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - "pip install --no-cache-dir paho-mqtt && python /app/subscriber.py"
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: subscriber-script
