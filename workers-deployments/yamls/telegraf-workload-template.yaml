apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf
  labels:
    app: telegraf
    zone: "${ZONE}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegraf
      zone: "${ZONE}"
  template:
    metadata:
      labels:
        app: telegraf
        zone: "${ZONE}"
    spec:
      nodeSelector:
        zone: "${ZONE}"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: telegraf
          image: jayyy12/telegraf-python3-sec:1.30
          env:
            - name: ZONE
              value: "${ZONE}"
          ports:
            - containerPort: 9273
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/telegraf/telegraf.conf
              subPath: telegraf.conf
            - name: offset-script
              mountPath: /data/offset_calc.py
              subPath: offset_calc.py
            - name: offset-script
              mountPath: /data/schedule.csv
              subPath: schedule.csv
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: telegraf-config
        - name: offset-script
          configMap:
            name: offset-calc-script
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: telegraf-metrics
  labels:
    app: telegraf
    zone: "${ZONE}"
    release: kube-prometheus-stack
spec:
  selector:
    app: telegraf
    zone: "${ZONE}"
  ports:
    - name: metrics
      port: 9273
      targetPort: 9273
